name: "build"
on: [push, pull_request]

defaults:
  run:
    working-directory: ./slides

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configuring the environment
        run: |
          bash utils/init.sh
      - name: Start Ollama for the RAG exercises
        run: |
          docker compose -f docker-compose.yml -f resources/compose.ollama.yml up -d --wait ollama
          docker compose -f docker-compose.yml -f resources/compose.ollama.yml run --rm ollama-pull
      - name: Running the notebooks (if any)
        run: >-
          docker compose -f docker-compose.yml -f resources/compose.ollama.yml run --rm
          -e OLLAMA_URL=http://ollama:11434 -e OLLAMA_MODEL=qwen2.5:0.5b
          build python /data/execute-notebooks.py
      - name: Save executed RAG notebook
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rag-notebook
          path: slides/lab-07-rag.ipynb
      - name: Ollama diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f resources/compose.ollama.yml logs ollama
      - name: Stop Ollama
        if: always()
        run: docker compose -f docker-compose.yml -f resources/compose.ollama.yml stop ollama
      - name: Generate the slides
        run: |
          docker compose run --rm publish
      - name: Copy downloadable resources
        run: |
          mkdir -p _site/resources
          cp -R resources/. _site/resources/
      - name: Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: slides/_site
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 120
      - name: Export pdfs
        run: |
          bash utils/export2pdf.sh
      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          cd ..
          npm install
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
