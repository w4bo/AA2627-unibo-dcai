# From slides/: docker compose -f compose.ollama.yml up -d --wait ollama
#              docker compose -f compose.ollama.yml run --rm ollama-pull
name: lab-07-rag

services:
  ollama:
    image: ollama/ollama:0.40.6
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 40

  ollama-pull:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
