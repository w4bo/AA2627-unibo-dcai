<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="monospace">

  <!-- Axes -->
  <line x1="70" y1="360" x2="600" y2="360" stroke="black" stroke-width="2"/>
  <line x1="70" y1="360" x2="70" y2="40" stroke="black" stroke-width="2"/>

  <!-- Axis Labels -->
  <text x="330" y="400" text-anchor="middle" font-size="16">Income</text>
  <text x="20" y="200" transform="rotate(-90 20,200)" text-anchor="middle" font-size="16">Loan</text>

  <!-- Income threshold -->
  <line x1="380" y1="360" x2="380" y2="40" stroke="gray" stroke-dasharray="6,6"/>
  <text x="385" y="60" font-size="12" fill="gray">income threshold</text>

  <!-- Accepted loans (mostly lower income) -->
  <text x="110" y="320">x</text>
  <text x="130" y="300">x</text>
  <text x="150" y="280">x</text>
  <text x="170" y="310">x</text>
  <text x="200" y="260">x</text>
  <text x="220" y="240">x</text>
  <text x="240" y="270">x</text>
  <text x="260" y="220">x</text>
  <text x="290" y="250">x</text>
  <text x="310" y="210">x</text>

  <!-- Around threshold (overlap region) -->
  <text x="340" y="240">x</text>
  <text x="350" y="210">x</text>
  <text x="360" y="260">o</text>
  <text x="370" y="220">x</text>
  <text x="390" y="230">o</text>
  <text x="400" y="250">o</text>
  <text x="410" y="210">x</text>

  <!-- Mostly rejected (higher income) -->
  <text x="430" y="260">o</text>
  <text x="450" y="240">o</text>
  <text x="470" y="220">o</text>
  <text x="490" y="250">o</text>
  <text x="510" y="200">o</text>
  <text x="530" y="230">o</text>
  <text x="550" y="210">o</text>
  <text x="570" y="240">o</text>

</svg>