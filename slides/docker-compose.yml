include:
  - resources/compose.ollama.yml

services:
  build:
    init: true
    image: w4bo/python:1.0.7
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./:/data
    command: bash -c "cd /data && chmod +x ./build.sh && ./build.sh"

  publish:
    init: true
    image: w4bo/quarto-slides:1.0.32
    hostname: publish
    container_name: publish
    ports:
      - "6780:6778"
    volumes:
      - ./:/data
    command: bash -c "chmod +x /data/publish.sh && /data/publish.sh"